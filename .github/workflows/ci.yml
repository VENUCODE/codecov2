name: CI/CD Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

jobs:
  # Code Quality Checks - Run in parallel
  uv-lock-check:
    name: UV Lock Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Run uv-lock check
        shell: bash
        run: |
          uv lock --check

  ruff-check:
    name: Ruff Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Run ruff check
        shell: bash
        run: |
          uv tool run ruff check .

  ruff-format-check:
    name: Ruff Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Run ruff format check
        shell: bash
        run: |
          uv tool run ruff format --check .

  gitleaks-check:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          wget -q -O /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Run gitleaks
        shell: bash
        run: |
          gitleaks detect --source . --verbose --no-git

  # Combined job that waits for all code quality checks
  code-quality:
    name: Code Quality (All Checks)
    runs-on: ubuntu-latest
    needs: [uv-lock-check, ruff-check, ruff-format-check, gitleaks-check]
    if: always()
    steps:
      - name: Check code quality status
        shell: bash
        run: |
          if [ "${{ needs.uv-lock-check.result }}" != "success" ] || \
             [ "${{ needs.ruff-check.result }}" != "success" ] || \
             [ "${{ needs.ruff-format-check.result }}" != "success" ] || \
             [ "${{ needs.gitleaks-check.result }}" != "success" ]; then
            echo "❌ One or more code quality checks failed"
            exit 1
          else
            echo "✅ All code quality checks passed"
          fi

  # Unit Tests - Depends on code quality checks
  unit-tests:
    name: Unit Tests and Coverage
    runs-on: ubuntu-latest
    needs: [uv-lock-check, ruff-check, ruff-format-check, gitleaks-check]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          # Install dependencies using uv pip install
          uv pip install --system -r requirements.txt
          uv pip install --system pytest-json-ctrf

      - name: Run tests and generate reports
        id: test
        shell: bash
        run: |
          # Create ctrf directory for CTRF reports
          mkdir -p ctrf
          # Run tests with both JUnit XML and CTRF JSON output
          # --cov-fail-under=75 ensures coverage is at least 75%
          pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=75 --junitxml=junit.xml --ctrf=./ctrf/ctrf-report.json -m "not integration and not e2e and not slow"

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit.xml
          check_name: 'Test Results'
          comment_mode: always
          report_individual_runs: true
          deduplicate_classes_by_file_name: true

      - name: Publish Test Report with GitHub Test Reporter
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/*.json'
          github-report: true
          summary-report: true
          test-report: true
          failed-report: true
          upload-artifact: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
        with:
          fail_ci_if_error: false
          files: ./coverage.xml
          flags: ${{ github.event_name == 'pull_request' && 'pr' || github.ref_name }}

      - name: Upload test results to Codecov
        if: always() && !cancelled()
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
        with:
          report_type: test_results
          files: ./junit.xml
          fail_ci_if_error: false

      - name: Check coverage threshold
        id: coverage_check
        shell: bash
        run: |
          if [ -f coverage.xml ]; then
            python << 'EOF'
          import xml.etree.ElementTree as ET
          import sys
          
          COVERAGE_THRESHOLD = 75
          
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              coverage = float(root.attrib.get('line-rate', 0)) * 100
              
              print(f'📊 Current coverage: {coverage:.2f}%')
              print(f'📋 Required coverage: {COVERAGE_THRESHOLD}%')
              print(f'')
              
              if coverage < COVERAGE_THRESHOLD:
                  print(f'❌ Coverage {coverage:.2f}% is below the required {COVERAGE_THRESHOLD}% threshold')
                  print(f'⚠️ This step will be marked as failed')
                  sys.exit(1)
              else:
                  print(f'✅ Coverage {coverage:.2f}% meets the required {COVERAGE_THRESHOLD}% threshold')
                  print(f'✅ This step will be marked as successful')
                  sys.exit(0)
          except Exception as e:
              print(f'❌ Error checking coverage: {e}')
              sys.exit(1)
          EOF
          else
            echo "❌ Coverage report not found"
            exit 1
          fi

      - name: Display coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage.xml ]; then
            python << EOF
          import xml.etree.ElementTree as ET
          import os
          
          event_name = os.environ.get('GITHUB_EVENT_NAME', 'unknown')
          
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              coverage = float(root.attrib.get('line-rate', 0)) * 100
              
              if event_name == 'pull_request':
                  print(f'📊 Current overall coverage: {coverage:.2f}%')
                  print(f'📝 Codecov will show patch coverage (coverage of changed lines) in PR comments')
                  print(f'ℹ️ Coverage threshold (75%) is enforced - PR merge will be blocked if below threshold')
              else:
                  print(f'📊 Current coverage: {coverage:.2f}%')
                  print(f'📋 Required coverage: 75%')
          except Exception as e:
              print(f'⚠️ Error reading coverage: {e}')
          EOF
          else
            echo "⚠️ Coverage report not found - tests may have failed before generating coverage"
          fi
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

  # Mutation Testing Setup - Depends on unit tests (runs in parallel with deployment)
  mutation-setup:
    name: Mutation Testing Setup
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest-json-ctrf
          uv pip install --system cosmic-ray

      - name: Detect modules
        id: detect
        shell: bash
        run: |
          python .github/scripts/detect-modules.py > modules.json
          modules=$(cat modules.json)
          echo "modules=$modules" >> $GITHUB_OUTPUT
          echo "Detected modules: $modules"

  # Parallel Mutation Testing (Matrix Strategy) - Depends on mutation-setup
  mutation-test:
    name: Mutation Test - ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: mutation-setup
    strategy:
      matrix:
        module: ${{ fromJson(needs.mutation-setup.outputs.modules) }}
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run mutation testing
        id: mutation
        uses: ./.github/actions/mutation-test-module
        with:
          module: ${{ matrix.module }}
          python-version: '3.10'

      - name: Upload module artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.module }}
          path: |
            db-${{ matrix.module }}.sqlite
            mutation-reports/${{ matrix.module }}/
            cosmic-ray-${{ matrix.module }}.toml
          retention-days: 30

  # Aggregate Mutation Results - Depends on mutation-test
  mutation-aggregate:
    name: Aggregate Mutation Results
    runs-on: ubuntu-latest
    needs: mutation-test
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system cosmic-ray

      - name: Download all module artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-*
          merge-multiple: true
          path: .

      - name: Check mutation status for all modules
        id: status
        shell: bash
        run: |
          echo "=== Mutation Testing Status ===" > mutation-summary.txt
          echo "" >> mutation-summary.txt
          
          total_jobs=0
          total_complete=0
          total_surviving=0
          
          for db_file in $(find . -name "db-*.sqlite" -type f); do
            if [ -f "$db_file" ]; then
              module=$(basename "$db_file" | sed 's/db-\(.*\)\.sqlite/\1/')
              echo "Module: $module" >> mutation-summary.txt
              echo "----------------------------------------" >> mutation-summary.txt
              
              # Capture full cr-report output
              cr-report "$db_file" --show-pending >> mutation-summary.txt
              
              # Extract numbers for summary (optional, for notification)
              report_output=$(cr-report "$db_file" --show-pending 2>/dev/null || echo "")
              jobs=$(echo "$report_output" | grep "total jobs:" | sed 's/.*total jobs: \([0-9]*\).*/\1/' || echo "0")
              complete=$(echo "$report_output" | grep "complete:" | sed 's/.*complete: \([0-9]*\).*/\1/' || echo "0")
              surviving=$(echo "$report_output" | grep "surviving mutants:" | sed 's/.*surviving mutants: \([0-9]*\).*/\1/' || echo "0")
              
              total_jobs=$((total_jobs + jobs))
              total_complete=$((total_complete + complete))
              total_surviving=$((total_surviving + surviving))
              
              echo "" >> mutation-summary.txt
            fi
          done
          
          echo "=== Summary ===" >> mutation-summary.txt
          echo "Total Jobs: $total_jobs" >> mutation-summary.txt
          echo "Total Complete: $total_complete" >> mutation-summary.txt
          echo "Total Surviving Mutants: $total_surviving" >> mutation-summary.txt
          
          # Display summary
          cat mutation-summary.txt
          
          # Save summary for notification
          echo "total_jobs=$total_jobs" >> $GITHUB_OUTPUT
          echo "total_complete=$total_complete" >> $GITHUB_OUTPUT
          echo "total_surviving=$total_surviving" >> $GITHUB_OUTPUT

      - name: Upload mutation reports and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports-all
          path: |
            mutation-reports/
            mutation-summary.txt
            db-*.sqlite
          retention-days: 30

  # Mutation Testing Notification - Depends on mutation-aggregate
  mutation-notify:
    name: Mutation Testing Notification
    runs-on: ubuntu-latest
    needs: mutation-aggregate
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: mutation-reports-all
          path: mutation-reports

      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let comment = '## 🧬 Mutation Testing Results\\n\\n';
            
            try {
              // Read the summary file
              const summaryPath = 'mutation-reports/mutation-summary.txt';
              if (fs.existsSync(summaryPath)) {
                const summary = fs.readFileSync(summaryPath, 'utf8');
                comment += '```\\n' + summary + '\\n```\\n\\n';
                comment += '📊 Detailed HTML reports are available in the workflow artifacts.\\n';
              } else {
                comment += '⚠️ Could not find mutation summary. Check workflow logs for details.\\n';
              }
            } catch (error) {
              comment += `⚠️ Error generating report: ${error.message}\\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Deployment - Depends on unit tests (runs in parallel with mutation testing)
  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Deployment placeholder
        shell: bash
        run: |
          echo "🚀 Deployment step - Add your deployment logic here"
          echo "This step runs after code quality checks and unit tests pass"
          echo "Only runs on push to main/master branches"
          echo "Runs in parallel with mutation testing"
