name: CI/CD Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

jobs:
  # Code Quality Checks - Run in parallel
  uv-lock-check:
    name: UV Lock Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Run uv-lock check
        shell: bash
        run: |
          uv lock --check

  ruff-check:
    name: Ruff Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Run ruff check
        shell: bash
        run: |
          uv tool run ruff check .

  ruff-format-check:
    name: Ruff Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Run ruff format check
        shell: bash
        run: |
          uv tool run ruff format --check .

  gitleaks-check:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          wget -q -O /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Run gitleaks
        shell: bash
        run: |
          gitleaks detect --source . --verbose --no-git

  # Combined job that waits for all code quality checks
  code-quality:
    name: Code Quality (All Checks)
    runs-on: ubuntu-latest
    needs: [uv-lock-check, ruff-check, ruff-format-check, gitleaks-check]
    if: always()
    steps:
      - name: Check code quality status
        shell: bash
        run: |
          if [ "${{ needs.uv-lock-check.result }}" != "success" ] || \
             [ "${{ needs.ruff-check.result }}" != "success" ] || \
             [ "${{ needs.ruff-format-check.result }}" != "success" ] || \
             [ "${{ needs.gitleaks-check.result }}" != "success" ]; then
            echo "❌ One or more code quality checks failed"
            exit 1
          else
            echo "✅ All code quality checks passed"
          fi

  # Unit Tests - Depends on code quality checks
  unit-tests:
    name: Unit Tests and Coverage
    runs-on: ubuntu-latest
    needs: [uv-lock-check, ruff-check, ruff-format-check, gitleaks-check]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          # Install dependencies using uv pip install
          uv pip install --system -r requirements.txt
          uv pip install --system pytest-json-ctrf

      - name: Run tests and generate reports
        id: test
        shell: bash
        run: |
          # Create ctrf directory for CTRF reports
          mkdir -p ctrf
          # Run tests with both JUnit XML and CTRF JSON output
          # --cov-fail-under=75 ensures coverage is at least 75%
          pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=75 --junitxml=junit.xml --ctrf=./ctrf/ctrf-report.json -m "not integration and not e2e and not slow"

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit.xml
          check_name: 'Test Results'
          comment_mode: always
          report_individual_runs: true
          deduplicate_classes_by_file_name: true

      - name: Publish Test Report with GitHub Test Reporter
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/*.json'
          github-report: true
          summary-report: true
          test-report: true
          failed-report: true
          upload-artifact: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
        with:
          fail_ci_if_error: false
          files: ./coverage.xml
          flags: ${{ github.event_name == 'pull_request' && 'pr' || github.ref_name }}

      - name: Upload test results to Codecov
        if: always() && !cancelled()
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
        with:
          report_type: test_results
          files: ./junit.xml
          fail_ci_if_error: false

      - name: Check coverage threshold
        id: coverage_check
        shell: bash
        run: |
          if [ -f coverage.xml ]; then
            python << 'EOF'
          import xml.etree.ElementTree as ET
          import sys
          
          COVERAGE_THRESHOLD = 75
          
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              coverage = float(root.attrib.get('line-rate', 0)) * 100
              
              print(f'📊 Current coverage: {coverage:.2f}%')
              print(f'📋 Required coverage: {COVERAGE_THRESHOLD}%')
              print(f'')
              
              if coverage < COVERAGE_THRESHOLD:
                  print(f'❌ Coverage {coverage:.2f}% is below the required {COVERAGE_THRESHOLD}% threshold')
                  print(f'⚠️ This step will be marked as failed')
                  sys.exit(1)
              else:
                  print(f'✅ Coverage {coverage:.2f}% meets the required {COVERAGE_THRESHOLD}% threshold')
                  print(f'✅ This step will be marked as successful')
                  sys.exit(0)
          except Exception as e:
              print(f'❌ Error checking coverage: {e}')
              sys.exit(1)
          EOF
          else
            echo "❌ Coverage report not found"
            exit 1
          fi

      - name: Display coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage.xml ]; then
            python << EOF
          import xml.etree.ElementTree as ET
          import os
          
          event_name = os.environ.get('GITHUB_EVENT_NAME', 'unknown')
          
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              coverage = float(root.attrib.get('line-rate', 0)) * 100
              
              if event_name == 'pull_request':
                  print(f'📊 Current overall coverage: {coverage:.2f}%')
                  print(f'📝 Codecov will show patch coverage (coverage of changed lines) in PR comments')
                  print(f'ℹ️ Coverage threshold (75%) is enforced - PR merge will be blocked if below threshold')
              else:
                  print(f'📊 Current coverage: {coverage:.2f}%')
                  print(f'📋 Required coverage: 75%')
          except Exception as e:
              print(f'⚠️ Error reading coverage: {e}')
          EOF
          else
            echo "⚠️ Coverage report not found - tests may have failed before generating coverage"
          fi
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

  # Mutation Testing Setup - Depends on unit tests (runs in parallel with deployment)
  mutation-setup:
    name: Mutation Testing Setup
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest-json-ctrf
          uv pip install --system cosmic-ray

      - name: Detect modules
        id: detect
        shell: bash
        run: |
          python .github/scripts/detect-modules.py > modules.json
          modules=$(cat modules.json)
          echo "modules=$modules" >> $GITHUB_OUTPUT
          echo "Detected modules: $modules"

  # Parallel Mutation Testing (Matrix Strategy) - Depends on mutation-setup
  mutation-test:
    name: Mutation Test - ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: mutation-setup
    strategy:
      matrix:
        module: ${{ fromJson(needs.mutation-setup.outputs.modules) }}
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run mutation testing
        id: mutation
        uses: ./.github/actions/mutation-test-module
        with:
          module: ${{ matrix.module }}
          python-version: '3.10'

      - name: Upload module artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.module }}
          path: |
            db-${{ matrix.module }}.sqlite
            mutation-reports/${{ matrix.module }}/
            cosmic-ray-${{ matrix.module }}.toml
          retention-days: 30

  # Aggregate Mutation Results - Depends on mutation-test
  mutation-aggregate:
    name: Aggregate Mutation Results
    runs-on: ubuntu-latest
    needs: mutation-test
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system cosmic-ray

      - name: Download all module artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-*
          merge-multiple: true
          path: .

      - name: Check mutation status for all modules
        id: status
        shell: bash
        run: |
          echo "=== Mutation Testing Status ===" > mutation-summary.txt
          echo "" >> mutation-summary.txt
          
          total_jobs=0
          total_complete=0
          total_surviving=0
          
          for db_file in $(find . -name "db-*.sqlite" -type f); do
            if [ -f "$db_file" ]; then
              module=$(basename "$db_file" | sed 's/db-\(.*\)\.sqlite/\1/')
              echo "Module: $module" >> mutation-summary.txt
              echo "----------------------------------------" >> mutation-summary.txt
              
              # Capture full cr-report output
              cr-report "$db_file" --show-pending >> mutation-summary.txt
              
              # Extract numbers for summary (optional, for notification)
              report_output=$(cr-report "$db_file" --show-pending 2>/dev/null || echo "")
              jobs=$(echo "$report_output" | grep "total jobs:" | sed 's/.*total jobs: \([0-9]*\).*/\1/' || echo "0")
              complete=$(echo "$report_output" | grep "complete:" | sed 's/.*complete: \([0-9]*\).*/\1/' || echo "0")
              surviving=$(echo "$report_output" | grep "surviving mutants:" | sed 's/.*surviving mutants: \([0-9]*\).*/\1/' || echo "0")
              
              total_jobs=$((total_jobs + jobs))
              total_complete=$((total_complete + complete))
              total_surviving=$((total_surviving + surviving))
              
              echo "" >> mutation-summary.txt
            fi
          done
          
          echo "=== Summary ===" >> mutation-summary.txt
          echo "Total Jobs: $total_jobs" >> mutation-summary.txt
          echo "Total Complete: $total_complete" >> mutation-summary.txt
          echo "Total Surviving Mutants: $total_surviving" >> mutation-summary.txt
          
          # Calculate killed mutants
          total_killed=$((total_complete - total_surviving))
          
          # Calculate mutation score (percentage of killed mutants)
          if [ $total_complete -gt 0 ]; then
            mutation_score=$(echo "scale=2; ($total_killed * 100) / $total_complete" | bc)
          else
            mutation_score=0
          fi
          
          echo "Total Killed: $total_killed" >> mutation-summary.txt
          echo "Mutation Score: ${mutation_score}%" >> mutation-summary.txt
          
          # Display summary
          cat mutation-summary.txt
          
          # Generate JSON summary for easy parsing
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Start JSON file
          echo "{" > mutation-summary.json
          echo "  \"commit_sha\": \"${GITHUB_SHA}\"," >> mutation-summary.json
          echo "  \"commit_short\": \"${COMMIT_SHORT}\"," >> mutation-summary.json
          echo "  \"run_id\": \"${GITHUB_RUN_ID}\"," >> mutation-summary.json
          echo "  \"timestamp\": \"${TIMESTAMP}\"," >> mutation-summary.json
          echo "  \"summary\": {" >> mutation-summary.json
          echo "    \"total_jobs\": $total_jobs," >> mutation-summary.json
          echo "    \"total_complete\": $total_complete," >> mutation-summary.json
          echo "    \"total_killed\": $total_killed," >> mutation-summary.json
          echo "    \"total_surviving\": $total_surviving," >> mutation-summary.json
          echo "    \"mutation_score\": $mutation_score" >> mutation-summary.json
          echo "  }," >> mutation-summary.json
          echo "  \"modules\": {" >> mutation-summary.json
          
          # Add per-module details
          first_module=true
          for db_file in $(find . -name "db-*.sqlite" -type f); do
            if [ -f "$db_file" ]; then
              module=$(basename "$db_file" | sed 's/db-\(.*\)\.sqlite/\1/')
              report_output=$(cr-report "$db_file" --show-pending 2>/dev/null || echo "")
              mod_jobs=$(echo "$report_output" | grep "total jobs:" | sed 's/.*total jobs: \([0-9]*\).*/\1/' || echo "0")
              mod_complete=$(echo "$report_output" | grep "complete:" | sed 's/.*complete: \([0-9]*\).*/\1/' || echo "0")
              mod_surviving=$(echo "$report_output" | grep "surviving mutants:" | sed 's/.*surviving mutants: \([0-9]*\).*/\1/' || echo "0")
              mod_killed=$((mod_complete - mod_surviving))
              if [ $mod_complete -gt 0 ]; then
                mod_score=$(echo "scale=2; ($mod_killed * 100) / $mod_complete" | bc)
              else
                mod_score=0
              fi
              
              # Add comma if not first module
              if [ "$first_module" = false ]; then
                echo "," >> mutation-summary.json
              fi
              first_module=false
              
              # Add module info
              echo "    \"$module\": {" >> mutation-summary.json
              echo "      \"total_jobs\": $mod_jobs," >> mutation-summary.json
              echo "      \"complete\": $mod_complete," >> mutation-summary.json
              echo "      \"killed\": $mod_killed," >> mutation-summary.json
              echo "      \"surviving\": $mod_surviving," >> mutation-summary.json
              echo "      \"mutation_score\": $mod_score" >> mutation-summary.json
              echo -n "    }" >> mutation-summary.json
            fi
          done
          
          # Close JSON
          echo "" >> mutation-summary.json
          echo "  }" >> mutation-summary.json
          echo "}" >> mutation-summary.json
          
          cat mutation-summary.json
          
          # Save summary for notification
          echo "total_jobs=$total_jobs" >> $GITHUB_OUTPUT
          echo "total_complete=$total_complete" >> $GITHUB_OUTPUT
          echo "total_surviving=$total_surviving" >> $GITHUB_OUTPUT
          echo "total_killed=$total_killed" >> $GITHUB_OUTPUT
          echo "mutation_score=$mutation_score" >> $GITHUB_OUTPUT

      - name: Install jq for JSON processing
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y jq || echo "jq installation failed, will use manual JSON"

      - name: Upload mutation reports and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports-all
          path: |
            mutation-reports/
            mutation-summary.txt
            mutation-summary.json
            db-*.sqlite
          retention-days: 30

  # Mutation Testing Notification - Depends on mutation-aggregate
  mutation-notify:
    name: Mutation Testing Notification
    runs-on: ubuntu-latest
    needs: mutation-aggregate
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: mutation-reports-all
          path: mutation-reports

      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let comment = '## 🧬 Mutation Testing Results\\n\\n';
            
            try {
              // Read the summary file
              const summaryPath = 'mutation-reports/mutation-summary.txt';
              if (fs.existsSync(summaryPath)) {
                const summary = fs.readFileSync(summaryPath, 'utf8');
                comment += '```\\n' + summary + '\\n```\\n\\n';
                comment += '📊 Detailed HTML reports are available in the workflow artifacts.\\n';
                if (context.ref === 'refs/heads/main' || context.ref === 'refs/heads/master') {
                  comment += '🌐 Reports will be deployed to GitHub Pages after merge.\\n';
                }
              } else {
                comment += '⚠️ Could not find mutation summary. Check workflow logs for details.\\n';
              }
            } catch (error) {
              comment += `⚠️ Error generating report: ${error.message}\\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Deployment - Depends on mutation-aggregate to deploy HTML reports to GitHub Pages
  deployment:
    name: Deploy Mutation Reports to GitHub Pages
    runs-on: ubuntu-latest
    needs: mutation-aggregate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download mutation reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mutation-reports-all
          path: mutation-reports

      - name: Debug - List downloaded files
        shell: bash
        run: |
          echo "=== Current directory ==="
          pwd
          echo ""
          echo "=== Root directory contents ==="
          ls -la
          echo ""
          echo "=== Contents of mutation-reports directory ==="
          if [ -d "mutation-reports" ]; then
            echo "mutation-reports exists"
            echo "=== All files in mutation-reports ==="
            find mutation-reports -type f | head -30
            echo ""
            echo "=== Directory structure ==="
            find mutation-reports -type d | head -30
            echo ""
            echo "=== All HTML files ==="
            find mutation-reports -name "*.html" -exec ls -lh {} \; || echo "No HTML files found"
            echo ""
            echo "=== All report.html files ==="
            find mutation-reports -name "report.html" -exec ls -lh {} \; || echo "No report.html files found"
            echo ""
            echo "=== Checking subdirectories ==="
            for dir in mutation-reports/*/; do
              if [ -d "$dir" ]; then
                echo "Directory: $dir"
                ls -la "$dir" | head -10
              fi
            done
          else
            echo "⚠️ mutation-reports directory does not exist"
            echo "Checking for alternative structures..."
            echo "=== All HTML files in current directory ==="
            find . -maxdepth 3 -name "*.html" -type f | head -20
            echo ""
            echo "=== All report.html files ==="
            find . -maxdepth 3 -name "report.html" -type f | head -20
          fi

      - name: Install jq and bc for data processing
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y jq bc || echo "Tools installation failed"

      - name: Generate pages from templates
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # Generate pages using script (script handles history storage and module copying)
          bash .github/scripts/generate-pages.sh "$GITHUB_SHA" "mutation-reports/mutation-summary.json"
          
          echo ""
          echo "=== Created pages directory structure ==="
          find pages -type f | head -20
          echo ""
          echo "=== Pages directory listing ==="
          ls -la pages/ || echo "pages directory is empty"
          if [ -d "pages" ]; then
            for dir in pages/*/; do
              if [ -d "$dir" ]; then
                echo "Directory: $dir"
                ls -la "$dir" || echo "  (empty)"
              fi
            done
          fi

      - name: Enable GitHub Pages (if not already enabled)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              // Check if Pages is already enabled
              const pages = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              console.log('✅ GitHub Pages is already enabled');
            } catch (error) {
              if (error.status === 404) {
                console.log('⚠️ GitHub Pages not enabled. Attempting to enable...');
                try {
                  // Determine default branch (main or master)
                  const repo = await github.rest.repos.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                  });
                  const defaultBranch = repo.data.default_branch;
                  
                  // Enable GitHub Pages with GitHub Actions as source
                  await github.rest.repos.createPagesSite({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    source: {
                      branch: defaultBranch,
                      path: '/',
                    },
                    build_type: 'workflow',
                  });
                  console.log(`✅ GitHub Pages enabled successfully with branch: ${defaultBranch}`);
                } catch (enableError) {
                  console.log('❌ Could not enable Pages automatically via API.');
                  console.log('📝 Please enable GitHub Pages manually:');
                  console.log('   1. Go to repository Settings → Pages');
                  console.log('   2. Set Source to "GitHub Actions"');
                  console.log('   3. Save the settings');
                  console.log(`   Error: ${enableError.message}`);
                }
              } else {
                console.log(`⚠️ Unexpected error checking Pages status: ${error.message}`);
              }
            }

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
