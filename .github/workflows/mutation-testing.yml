name: Mutation Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Job 1: Setup and Detect Modules
  setup:
    name: Setup and Detect Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest-json-ctrf

      - name: Detect modules
        id: detect
        shell: bash
        run: |
          python .github/scripts/detect-modules.py > modules.json
          modules=$(cat modules.json)
          echo "modules=$modules" >> $GITHUB_OUTPUT
          echo "Detected modules: $modules"

  # Job 2: Parallel Mutation Testing (Matrix Strategy)
  mutation-test:
    name: Mutation Test - ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        module: ${{ fromJson(needs.setup.outputs.modules) }}
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run mutation testing
        id: mutation
        uses: ./.github/actions/mutation-test-module
        with:
          module: ${{ matrix.module }}
          python-version: '3.10'

      - name: Upload module artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.module }}
          path: |
            db-${{ matrix.module }}.sqlite
            mutation-reports/${{ matrix.module }}/
            cosmic-ray-${{ matrix.module }}.toml
          retention-days: 30

  # Job 3: Status Monitor (Continuous Loop)
  status-monitor:
    name: Status Monitor
    runs-on: ubuntu-latest
    needs: [setup, mutation-test]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system -r requirements.txt

      - name: Download all module artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-*
          merge-multiple: true
          path: .

      - name: Monitor mutation testing status
        shell: bash
        env:
          CHECK_INTERVAL: 30
          MAX_WAIT_TIME: 3600
        run: |
          python .github/scripts/monitor-mutation-status.py

      - name: Upload status summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-status-summary
          path: mutation-reports/status-summary.json
          retention-days: 30

  # Job 4: Aggregate Results
  aggregate:
    name: Aggregate Results
    runs-on: ubuntu-latest
    needs: [mutation-test, status-monitor]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system -r requirements.txt

      - name: Download all module artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-*
          merge-multiple: true
          path: .

      - name: Aggregate mutation results
        shell: bash
        run: |
          python .github/scripts/aggregate-mutation-results.py

      - name: Download module reports
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-*
          merge-multiple: true
          path: mutation-reports

      - name: Upload aggregated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports-aggregated
          path: |
            mutation-reports/aggregated/
            mutation-reports/*/
          retention-days: 30

  # Job 5: Upload and Notify
  notify:
    name: Upload and Notify
    runs-on: ubuntu-latest
    needs: aggregate
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Download aggregated reports
        uses: actions/download-artifact@v4
        with:
          name: mutation-reports-aggregated
          path: mutation-reports

      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let comment = '## 🧬 Mutation Testing Results\n\n';
            
            try {
              const summaryPath = 'mutation-reports/aggregated/summary.json';
              if (fs.existsSync(summaryPath)) {
                const data = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
                const overall = data.overall;
                const score = overall.mutation_score;
                const emoji = score >= 70 ? '✅' : '⚠️';
                
                comment += `${emoji} **Overall Mutation Score: ${score.toFixed(2)}%**\n\n`;
                comment += `- Total Mutations: ${overall.total_mutations}\n`;
                comment += `- Killed: ${overall.killed}\n`;
                comment += `- Survived: ${overall.survived}\n`;
                comment += `- Pending: ${overall.pending}\n\n`;
                
                comment += `### Per-Module Breakdown\n\n`;
                for (const [module, scores] of Object.entries(data.modules)) {
                  const modEmoji = scores.score >= 70 ? '✅' : '⚠️';
                  comment += `${modEmoji} **${module}**: ${scores.score.toFixed(2)}% `;
                  comment += `(${scores.killed}/${scores.completed} killed)\n`;
                }
                
                comment += `\n📊 Detailed reports are available in the workflow artifacts.\n`;
              } else {
                comment += '⚠️ Could not find aggregated results. Check workflow logs for details.\n';
              }
            } catch (error) {
              comment += `⚠️ Error generating report: ${error.message}\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
